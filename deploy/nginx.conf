map $uri $zetas_cache_control {
    default "no-cache";
    ~^/api/ "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $zetas_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://filebroker-cdn.lazada.co.id; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/lazada/oauth/callback {
        # Proxy error logs can include the raw OAuth URL. Keep safe app outcomes,
        # but never retain an authorization code at this proxy.
        access_log off;
        error_log /dev/null;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $zetas_api http://api:5000;
        proxy_pass $zetas_api;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $zetas_client_ip;
        proxy_set_header X-Forwarded-For $zetas_client_ip;
        proxy_set_header X-Forwarded-Proto $zetas_forwarded_proto;
    }

    location /api/ {
        # Re-resolve after API container recreation; do not cache its old IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $zetas_api http://api:5000;
        proxy_pass $zetas_api;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $http_host;
        # Preserve the client IP/protocol from the trusted host TLS proxy only.
        # The web port must remain private; never accept these from public clients.
        proxy_set_header X-Real-IP $zetas_client_ip;
        proxy_set_header X-Forwarded-For $zetas_client_ip;
        proxy_set_header X-Forwarded-Proto $zetas_forwarded_proto;
    }

    location = /service-worker.js {
        try_files $uri =404;
    }

    location = /index.html {
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

map $http_x_real_ip $zetas_client_ip {
    "" $remote_addr;
    default $http_x_real_ip;
}

map $http_x_forwarded_proto $zetas_forwarded_proto {
    default $scheme;
    https https;
}