name: zetas-id

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zetas}
      POSTGRES_USER: ${POSTGRES_USER:-zetas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the environment}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - data
    logging: *logging

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the environment}
      NODE_ENV: production
      PORT: "5000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (at least 32 random characters)}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the public HTTPS origin}
      # Only private Nginx traffic reaches this unexposed API. Override with the
      # exact Nginx IP/CIDR for a narrower allowlist on your own network.
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      # Optional, backend-only. Do not pass these values to the web/build services.
      LAZADA_MODE: ${LAZADA_MODE:-}
      LAZADA_COUNTRY: ${LAZADA_COUNTRY:-id}
      LAZADA_REDIRECT_URI: ${LAZADA_REDIRECT_URI:-}
      LAZADA_APP_KEY: ${LAZADA_APP_KEY:-}
      LAZADA_APP_SECRET: ${LAZADA_APP_SECRET:-}
      LAZADA_TOKEN_ENCRYPTION_KEY: ${LAZADA_TOKEN_ENCRYPTION_KEY:-}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - data
      - edge
    logging: *logging

  # Nginx serves the built frontend and proxies /api; no Vite server in production.
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz && wget -q -O /dev/null http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    networks:
      - edge
    logging: *logging

networks:
  data:
    internal: true
  edge:

volumes:
  # Keep this project and volume name unchanged across application updates.
  # Matches the volume name from the previous compose.yaml.
  postgres_data:
    name: zetas-id_postgres_data