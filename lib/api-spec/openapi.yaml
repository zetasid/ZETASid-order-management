openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ZETAS.id order management API
servers:
  - url: /api
    description: Base API path
security:
  - cookieAuth: []
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries
  - name: orders
    description: Order read operations
paths:
  /lazada/orders/push:
    post:
      operationId: receiveLazadaOrderPush
      tags: [lazada]
      summary: HTTPS LPM order trigger; durable ACK, no order data trusted from the push
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LazadaOrderNotification"
      responses:
        "200": { description: Authenticated notification durably queued or duplicate acknowledged }
        "400": { description: "Invalid payload, timestamp, site, or non-HTTPS request" }
        "401": { description: Invalid LPM signature }
        "429": { description: Webhook rate limit exceeded }
        "503": { description: Notification not persisted; sender must retry }
  /lazada/orders/push-status:
    get:
      operationId: getLazadaOrderPushStatus
      tags: [lazada]
      responses:
        "200":
          description: Safe ingestion metadata; no credentials or raw payloads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LazadaOrderPushStatus"
        "401":
          $ref: "#/components/responses/AuthError"
  /lazada/orders/sync:
    post:
      operationId: syncLazadaOrders
      tags: [lazada]
      summary: Manually read one page of GetOrders and all its GetOrderItems; never writes to Lazada
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LazadaOrderSyncInput"
      responses:
        "200":
          description: Transactionally stored page and observed provider field names, without customer values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LazadaOrderSyncResult"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "409":
          $ref: "#/components/responses/AuthError"
        "502":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /lazada/connection:
    get:
      operationId: getLazadaConnection
      tags: [lazada]
      summary: Private cached connection status; never calls order APIs
      responses:
        "200":
          description: Safe metadata only; never includes credentials or tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LazadaConnection"
        "401":
          $ref: "#/components/responses/AuthError"
  /lazada/oauth/authorize:
    post:
      operationId: authorizeLazada
      tags: [lazada]
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Lazada authorization URL and HTTP-only browser binding cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LazadaAuthorization"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /lazada/oauth/callback:
    get:
      operationId: lazadaOAuthCallback
      tags: [lazada]
      security: []
      description: HTTPS only; single-use state, browser binding and initiating session required
      parameters:
        - name: state
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
      responses:
        "303":
          description: Redirect to Settings with a safe outcome, never tokens or provider payload
  /lazada/check:
    post:
      operationId: checkLazadaConnection
      tags: [lazada]
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Explicit manual GetSeller check succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LazadaConnection"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "409":
          $ref: "#/components/responses/AuthError"
        "502":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Session created; opaque session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/AuthError"
  /auth/me:
    get:
      operationId: getSession
      tags: [auth]
      responses:
        "200":
          description: Active authorized user and CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/AuthError"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Session revoked and cookie removed
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      description: Up to 100 newest matching orders; search is applied in PostgreSQL before the limit.
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, cancelled]
      responses:
        "400":
          description: Invalid search or status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{orderId}/deliver-digital:
    post:
      operationId: deliverDigitalOrder
      tags: [orders]
      summary: Manually mark every digital item in one pending Lazada order as delivered
      description: Requires an authenticated session, CSRF token and HTTPS. The operator must confirm in the UI. No delivery payload is sent; duplicate attempts are serialized and audited.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: All requested items were accepted by Lazada and the order was marked delivered locally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order identifier or request not using HTTPS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/AuthError"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order is not pending, is already processing, or a previous delivery result is unresolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Lazada did not confirm delivery for every item; no completed status is written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: zetas_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  responses:
    AuthError:
      description: Generic authentication or access error; 429 includes Retry-After
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LazadaOrderNotification:
      type: object
      required: [seller_id, message_type, site, timestamp, data]
      properties:
        seller_id:
          oneOf:
            - { type: string, pattern: "^[1-9][0-9]{0,39}$" }
            - { type: integer, minimum: 1, maximum: 9007199254740991 }
        message_type: { type: integer, enum: [0] }
        site: { type: string }
        timestamp: { type: integer, minimum: 1 }
        data:
          type: object
          required: [trade_order_id, trade_order_line_id, order_status, status_update_time]
          properties:
            trade_order_id:
              oneOf:
                - { type: string, pattern: "^[1-9][0-9]{0,39}$" }
                - { type: integer, minimum: 1, maximum: 9007199254740991 }
            trade_order_line_id:
              oneOf:
                - { type: string, pattern: "^[1-9][0-9]{0,39}$" }
                - { type: integer, minimum: 1, maximum: 9007199254740991 }
            order_status: { type: string, minLength: 1, maxLength: 64 }
            status_update_time: { type: integer, minimum: 1 }
    LazadaOrderPushStatus:
      type: object
      required: [active, lastPush, lastSync, lastError, pending, reconciliationHours, nextReconciliation, lastProcessedPush, webhookPath]
      properties:
        active: { type: boolean, description: At least one authenticated push has been successfully fetched from the order APIs; external subscription not introspected. }
        lastPush: { type: ["string", "null"], format: date-time }
        lastSync: { type: ["string", "null"], format: date-time }
        lastError: { type: ["string", "null"] }
        pending: { type: integer }
        reconciliationHours: { type: integer }
        nextReconciliation: { type: ["string", "null"], format: date-time }
        lastProcessedPush: { type: ["string", "null"], format: date-time }
        webhookPath: { type: string }
    LazadaOrderSyncInput:
      type: object
      additionalProperties: false
      required: [createdAfter, createdBefore, offset]
      properties:
        createdAfter: { type: string, format: date-time }
        createdBefore: { type: string, format: date-time }
        offset: { type: integer, minimum: 0, maximum: 10000 }
    LazadaOrderSyncResult:
      type: object
      required: [ordersRead, itemsRead, countTotal, nextOffset, syncedAt, orderFields, itemFields, digitalDetailPresent, digitalDetailNonempty]
      properties:
        ordersRead: { type: integer }
        itemsRead: { type: integer }
        countTotal: { type: ["integer", "null"] }
        nextOffset: { type: ["integer", "null"] }
        syncedAt: { type: string, format: date-time }
        orderFields: { type: array, items: { type: string } }
        itemFields: { type: array, items: { type: string } }
        digitalDetailPresent: { type: integer }
        digitalDetailNonempty: { type: integer }
    LazadaConnection:
      type: object
      required: [mode, configured, connected, reason, country, expiresAt, lastCheckedAt, callbackUri]
      properties:
        mode: { type: string, enum: [testing] }
        configured: { type: boolean }
        connected: { type: boolean }
        reason: { type: string }
        country: { type: [string, "null"] }
        expiresAt: { type: [string, "null"] }
        lastCheckedAt: { type: [string, "null"] }
        callbackUri: { type: [string, "null"] }
    LazadaAuthorization:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl: { type: string }
    LoginCredentials:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [email, password]
    AuthSession:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            displayName:
              type: ["string", "null"]
          required: [id, email, displayName]
        csrfToken:
          type: string
      required: [user, csrfToken]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        marketplaceOrderId:
          type: string
        lazadaOrderId:
          type: string
        productName:
          type: string
        buyerName:
          type: ["string", "null"]
        amount:
          type: ["number", "null"]
          minimum: 0
        lazadaStatuses: { type: ["array", "null"], items: { type: string } }
        sourceCreatedAt: { type: ["string", "null"] }
        sourceUpdatedAt: { type: ["string", "null"] }
        sourcePrice: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
        syncedAt: { type: ["string", "null"], format: date-time }
        status:
          type: ["string", "null"]
          enum: [pending, processing, completed, cancelled, null]
        paymentStatus:
          type: string
          enum: [unpaid, pending, confirmed, cancelled, unknown]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required:
        - id
        - marketplaceOrderId
        - lazadaOrderId
        - productName
        - buyerName
        - amount
        - status
        - paymentStatus
        - createdAt
        - updatedAt
        - items
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lazadaOrderItemId:
          type: string
        orderId:
          type: string
          format: uuid
        productName:
          type: string
        digitalDetail:
          type: ["string", "null"]
          description: Original string or pretty-printed JSON for structured PostgreSQL digital_detail.
        digitalDetailSource: { type: ["string", "null"] }
        sourceStatus: { type: ["string", "null"] }
        sourceCreatedAt: { type: ["string", "null"] }
        sourceUpdatedAt: { type: ["string", "null"] }
        itemPrice: { type: ["string", "null"] }
        paidPrice: { type: ["string", "null"] }
        currency: { type: ["string", "null"] }
        variation: { type: ["string", "null"] }
        sku: { type: ["string", "null"] }
        shopSku: { type: ["string", "null"] }
        extraAttributes: { type: ["string", "null"] }
        status:
          type: ["string", "null"]
          enum: [pending, processing, completed, cancelled, null]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, lazadaOrderItemId, orderId, productName, digitalDetail, status, createdAt, updatedAt]
    DashboardSummary:
      type: object
      properties:
        totalOrders:
          type: integer
        pendingOrders:
          type: integer
        processingOrders:
          type: integer
        completedOrders:
          type: integer
        cancelledOrders:
          type: integer
        unmappedOrders:
          type: integer
          description: Unknown provider statuses remain unclassified; never guessed as pending.
        totalRevenue:
          type: number
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
      required:
        - totalOrders
        - pendingOrders
        - processingOrders
        - completedOrders
        - cancelledOrders
        - totalRevenue
        - recentOrders
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

