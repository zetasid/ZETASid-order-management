openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ZETAS.id order management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries
  - name: orders
    description: Order read operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      description: Up to 100 newest matching orders; search is applied in PostgreSQL before the limit.
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, cancelled]
      responses:
        "400":
          description: Invalid search or status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        marketplaceOrderId:
          type: string
        lazadaOrderId:
          type: string
        productName:
          type: string
        buyerName:
          type: ["string", "null"]
        amount:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [pending, processing, completed, cancelled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required:
        - id
        - marketplaceOrderId
        - lazadaOrderId
        - productName
        - buyerName
        - amount
        - status
        - createdAt
        - updatedAt
        - items
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lazadaOrderItemId:
          type: string
        orderId:
          type: string
          format: uuid
        productName:
          type: string
        digitalDetail:
          type: ["string", "null"]
          description: Original string or pretty-printed JSON for structured PostgreSQL digital_detail.
        status:
          type: string
          enum: [pending, processing, completed, cancelled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, lazadaOrderItemId, orderId, productName, digitalDetail, status, createdAt, updatedAt]
    DashboardSummary:
      type: object
      properties:
        totalOrders:
          type: integer
        pendingOrders:
          type: integer
        processingOrders:
          type: integer
        completedOrders:
          type: integer
        cancelledOrders:
          type: integer
        totalRevenue:
          type: integer
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
      required:
        - totalOrders
        - pendingOrders
        - processingOrders
        - completedOrders
        - cancelledOrders
        - totalRevenue
        - recentOrders
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

